<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Dashboard</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 24px; }
      .page-title { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
      .section { margin: 16px 0; }
      .file-list { list-style: none; padding: 0; margin: 8px 0 0; }
      .file-item { margin: 6px 0; }
      .actions { display: inline-flex; gap: 10px; margin-left: 8px; }
      .btn { display: inline-block; padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; text-decoration: none; color: #111; background: #fff; }
      .btn:hover { background: #f5f5f5; }
      .empty { color: #666; }
      .note { color: #444; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1 class="page-title">Data Project</h1>

    <div class="section">
      <div class="note">Available datasets found in the repository:</div>
      {% if files %}
      <ul class="file-list">
        {% for f in files %}
          <li class="file-item">
            <span>{{ f }}</span>
            <span class="actions">
              <a class="btn" href="/api/preview/{{ f }}" target="_blank" rel="noopener">Preview</a>
              <a class="btn" href="/api/columns/{{ f }}" target="_blank" rel="noopener">Columns</a>
            </span>
          </li>
        {% endfor %}
      </ul>
      {% else %}
        <div class="empty">No datasets detected yet.</div>
      {% endif %}
    </div>
  </body>
</html>
